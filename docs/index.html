<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片格式转换</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs" type="module"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#f5f5f5;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.header{width:100%;background:#1a1a2e;padding:14px 24px;display:flex;align-items:center;gap:10px}
.header h1{color:#e0e0e0;font-size:17px;font-weight:600;letter-spacing:0}
.header .badge{background:#3a3a5c;color:#aab;font-size:10px;padding:2px 8px;border-radius:3px}
.header .gh-link{margin-left:auto;color:#889;font-size:12px;text-decoration:none;transition:color .15s}
.header .gh-link:hover{color:#c0c0e0}
.container{width:100%;max-width:560px;margin:36px auto;padding:0 16px}
.upload-zone{border:2px dashed #c0c0d0;border-radius:6px;padding:44px 24px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;background:#fff}
.upload-zone:hover,.upload-zone.dragover{border-color:#4a6cf7;background:#f8f9ff}
.upload-zone .icon{font-size:32px;margin-bottom:10px;color:#888}
.upload-zone p{color:#666;font-size:14px;line-height:1.6}
.upload-zone .hint{color:#999;font-size:12px;margin-top:4px}
.upload-zone input{display:none}
.file-info{display:none;margin-top:14px;padding:10px 14px;background:#fff;border-radius:6px;font-size:13px;color:#555;border:1px solid #e5e5ef}
.file-info.visible{display:block}
.file-info strong{color:#333}
.preview{display:none;margin-top:14px;text-align:center;background:#fff;border-radius:6px;border:1px solid #e5e5ef;padding:16px}
.preview.visible{display:block}
.preview img{max-width:100%;max-height:200px;border-radius:3px}
.preview .meta{font-size:12px;color:#888;margin-top:8px}
.section{margin-top:20px;background:#fff;border-radius:6px;padding:18px;border:1px solid #e5e5ef}
.section-label{font-size:11px;text-transform:uppercase;color:#888;letter-spacing:0.5px;margin-bottom:10px}
.format-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.format-btn{padding:9px 6px;border:1.5px solid #d8d8e8;border-radius:6px;background:#fafafa;cursor:pointer;font-size:13px;font-weight:500;color:#555;transition:all .15s;text-align:center}
.format-btn:hover{border-color:#4a6cf7;color:#4a6cf7}
.format-btn.active{border-color:#4a6cf7;background:#eef1ff;color:#4a6cf7;font-weight:600}
.format-btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.quality-row{display:none;align-items:center;gap:10px;margin-top:14px}
.quality-row.visible{display:flex}
.quality-row label{font-size:13px;color:#666;white-space:nowrap}
.quality-row input[type=range]{flex:1;accent-color:#4a6cf7}
.quality-row span{font-size:13px;color:#333;min-width:28px;text-align:right}
.page-row{display:none;align-items:center;gap:10px;margin-top:14px}
.page-row.visible{display:flex}
.page-row label{font-size:13px;color:#666}
.page-row select{font-size:13px;padding:4px 8px;border:1px solid #d8d8e8;border-radius:4px;background:#fff}
.btn-convert{margin-top:18px;width:100%;padding:12px;border:none;border-radius:6px;background:#4a6cf7;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s}
.btn-convert:hover{background:#3b5de7}
.btn-convert:disabled{background:#c0c0d0;cursor:not-allowed}
.result{display:none;margin-top:18px;padding:14px;border-radius:6px;font-size:14px}
.result.success{display:block;background:#eaf6ee;border:1px solid #b8dfc6;color:#2a7d46}
.result.error{display:block;background:#fdecea;border:1px solid #f5c6cb;color:#b33a3a}
.result a{color:#2a7d46;font-weight:600}
.spinner{display:none;width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;margin-right:8px;vertical-align:middle}
.spinner.visible{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{width:100%;text-align:center;padding:20px 16px 32px;color:#b0b0c0;font-size:11px}
</style>
</head>
<body>

<div class="header">
  <h1>图片格式转换</h1>
  <span class="badge">PDF &middot; ICO &middot; JPG &middot; PNG</span>
  <a class="gh-link" href="https://github.com/Simon404Error/imgconvert" target="_blank">GitHub</a>
</div>

<div class="container">

  <div class="upload-zone" id="uploadZone">
    <div class="icon">&#128196;</div>
    <p>拖拽文件到此处，或点击选择文件</p>
    <p class="hint">支持 PDF、ICO、JPG、JPEG、PNG</p>
    <input type="file" id="fileInput" accept=".pdf,.ico,.jpg,.jpeg,.png">
  </div>

  <div class="file-info" id="fileInfo">
    已选择: <strong id="fileName"></strong>
    &nbsp;<span id="fileSize"></span>
  </div>

  <div class="preview" id="preview">
    <img id="previewImg" alt="">
    <div class="meta" id="previewMeta"></div>
  </div>

  <div class="section">
    <div class="section-label">目标格式</div>
    <div class="format-grid" id="formatGrid">
      <button class="format-btn active" data-fmt="png">PNG</button>
      <button class="format-btn" data-fmt="jpg">JPG</button>
      <button class="format-btn" data-fmt="ico">ICO</button>
      <button class="format-btn" data-fmt="pdf">PDF</button>
    </div>
    <div class="quality-row" id="qualityRow">
      <label>JPEG 质量</label>
      <input type="range" id="quality" min="10" max="100" value="95" step="1">
      <span id="qualityVal">95</span>
    </div>
    <div class="page-row" id="pageRow">
      <label>PDF 页码</label>
      <select id="pageSelect"></select>
    </div>
  </div>

  <button class="btn-convert" id="btnConvert" disabled>选择文件后开始转换</button>

  <div class="result" id="result"></div>

</div>

<div class="footer">所有转换均在浏览器本地完成，文件不会上传到任何服务器</div>

<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs';

// ─── DOM refs ────────────────────────────────────
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const fileInfo = document.getElementById('fileInfo');
const fileName = document.getElementById('fileName');
const fileSize = document.getElementById('fileSize');
const preview = document.getElementById('preview');
const previewImg = document.getElementById('previewImg');
const previewMeta = document.getElementById('previewMeta');
const formatGrid = document.getElementById('formatGrid');
const qualityRow = document.getElementById('qualityRow');
const quality = document.getElementById('quality');
const qualityVal = document.getElementById('qualityVal');
const pageRow = document.getElementById('pageRow');
const pageSelect = document.getElementById('pageSelect');
const btnConvert = document.getElementById('btnConvert');
const result = document.getElementById('result');

// ─── State ───────────────────────────────────────
let selectedFile = null;
let selectedFmt = 'png';
let pdfDoc = null;       // pdf.js document for PDF sources
let pdfPageCount = 0;

// ─── Format map ──────────────────────────────────
const EXT_MAP = {'.jpg':'jpg','.jpeg':'jpg','.png':'png','.ico':'ico','.pdf':'pdf'};

// ─── UI events ───────────────────────────────────
uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) loadFile(fileInput.files[0]);
});

formatGrid.addEventListener('click', e => {
  if (!e.target.classList.contains('format-btn') || e.target.disabled) return;
  formatGrid.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  selectedFmt = e.target.dataset.fmt;
  qualityRow.classList.toggle('visible', selectedFmt === 'jpg');
});

quality.addEventListener('input', () => { qualityVal.textContent = quality.value; });

// ─── File loading ────────────────────────────────
async function loadFile(file) {
  selectedFile = file;
  pdfDoc = null;
  pdfPageCount = 0;
  pageSelect.innerHTML = '';
  pageRow.classList.remove('visible');
  preview.classList.remove('visible');

  const ext = '.' + file.name.split('.').pop().toLowerCase();
  const srcFmt = EXT_MAP[ext] || '';

  fileName.textContent = file.name;
  fileSize.textContent = formatBytes(file.size);
  fileInfo.classList.add('visible');
  result.className = 'result';
  result.innerHTML = '';

  // Disable same-format button
  formatGrid.querySelectorAll('.format-btn').forEach(b => {
    b.disabled = (b.dataset.fmt === srcFmt);
  });
  // Re-select if current is disabled
  const active = formatGrid.querySelector('.format-btn.active');
  if (active && active.disabled) {
    const first = formatGrid.querySelector('.format-btn:not([disabled])');
    if (first) { first.click(); }
  }

  // Preview & PDF page count
  if (srcFmt === 'pdf') {
    try {
      const buf = await file.arrayBuffer();
      pdfDoc = await pdfjsLib.getDocument({data: buf}).promise;
      pdfPageCount = pdfDoc.numPages;
      for (let i = 1; i <= pdfPageCount; i++) pageSelect.add(new Option(`第 ${i} 页`, i));
      pageRow.classList.add('visible');
      previewMeta.textContent = `共 ${pdfPageCount} 页`;
      preview.classList.add('visible');
      previewImg.style.display = 'none';
    } catch { previewMeta.textContent = '无法解析 PDF'; preview.classList.add('visible'); previewImg.style.display = 'none'; }
  } else {
    const url = URL.createObjectURL(file);
    previewImg.src = url;
    previewImg.style.display = '';
    preview.classList.add('visible');
    if (srcFmt === 'ico') previewMeta.textContent = 'ICO 图标';
    else previewMeta.textContent = '';
  }

  btnConvert.disabled = false;
  btnConvert.textContent = '开始转换';
}

function formatBytes(b) {
  if (b < 1024) return `(${b} B)`;
  if (b < 1048576) return `(${(b/1024).toFixed(1)} KB)`;
  return `(${(b/1048576).toFixed(1)} MB)`;
}

// ─── Image loading helpers ───────────────────────
function loadImageFromBlob(blob) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(blob);
  });
}

function loadImageFromArrayBuffer(buf, mime) {
  const blob = new Blob([buf], {type: mime});
  return loadImageFromBlob(blob);
}

// ─── ICO parser ──────────────────────────────────
function parseICO(buf) {
  const dv = new DataView(buf);
  if (dv.getUint16(0, true) !== 0 || dv.getUint16(2, true) !== 1) throw new Error('不是有效的 ICO 文件');
  const count = dv.getUint16(4, true);
  const entries = [];
  for (let i = 0; i < count; i++) {
    const off = 6 + i * 16;
    entries.push({
      width:  dv.getUint8(off) || 256,
      height: dv.getUint8(off + 1) || 256,
      size:   dv.getUint32(off + 8, true),
      offset: dv.getUint32(off + 12, true),
    });
  }
  // Find largest entry
  entries.sort((a, b) => (b.width * b.height) - (a.width * a.height));
  return entries[0];
}

function extractICOImage(buf, entry) {
  const data = buf.slice(entry.offset, entry.offset + entry.size);
  // Check if it's PNG data
  if (data[0] === 0x89 && data[1] === 0x50 && data[2] === 0x4E && data[3] === 0x47) {
    return new Blob([data], {type: 'image/png'});
  }
  // BMP: try to render via canvas hack – wrap as a minimal data URL isn't straightforward
  // For BMP ICO entries, we create a blob and let the browser try
  return new Blob([data], {type: 'image/bmp'});
}

// ─── ICO encoder ─────────────────────────────────
const ICO_SIZES = [256, 128, 64, 48, 32, 16];

async function createICOBlob(img, maxSize) {
  const parts = [];
  const dirEntries = [];

  for (const s of ICO_SIZES) {
    if (s > maxSize) continue;
    const c = document.createElement('canvas');
    c.width = s; c.height = s;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, s, s);
    const pngBlob = await new Promise(r => c.toBlob(r, 'image/png'));
    const pngBuf = await pngBlob.arrayBuffer();
    const pngBytes = new Uint8Array(pngBuf);
    dirEntries.push({width:s, height:s, size:pngBytes.length, data:pngBytes});
  }

  if (dirEntries.length === 0) {
    const s = ICO_SIZES[ICO_SIZES.length - 1];
    const c = document.createElement('canvas');
    c.width = s; c.height = s;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, s, s);
    const pngBlob = await new Promise(r => c.toBlob(r, 'image/png'));
    const pngBuf = await pngBlob.arrayBuffer();
    dirEntries.push({width:s, height:s, size:new Uint8Array(pngBuf).length, data:new Uint8Array(pngBuf)});
  }

  // Calculate offsets
  const headerSize = 6;
  const dirSize = dirEntries.length * 16;
  let dataOffset = headerSize + dirSize;
  const totalSize = dataOffset + dirEntries.reduce((s, e) => s + e.size, 0);
  const out = new Uint8Array(totalSize);
  const view = new DataView(out.buffer);

  // Header
  view.setUint16(0, 0, true);
  view.setUint16(2, 1, true);
  view.setUint16(4, dirEntries.length, true);

  // Directory
  for (let i = 0; i < dirEntries.length; i++) {
    const e = dirEntries[i];
    const off = 6 + i * 16;
    view.setUint8(off, e.width === 256 ? 0 : e.width);
    view.setUint8(off + 1, e.height === 256 ? 0 : e.height);
    view.setUint8(off + 2, 0);
    view.setUint8(off + 3, 0);
    view.setUint16(off + 4, 1, true);
    view.setUint16(off + 6, 32, true);
    view.setUint32(off + 8, e.size, true);
    view.setUint32(off + 12, dataOffset, true);
    dataOffset += e.size;
  }

  // Image data
  let pos = headerSize + dirSize;
  for (const e of dirEntries) {
    out.set(e.data, pos);
    pos += e.size;
  }

  return new Blob([out], {type: 'image/x-icon'});
}

// ─── Canvas conversion ───────────────────────────
function canvasToBlob(canvas, format, q) {
  return new Promise(resolve => {
    const mime = format === 'jpg' ? 'image/jpeg' : 'image/png';
    canvas.toBlob(resolve, mime, q / 100);
  });
}

// ─── PDF → Image ─────────────────────────────────
async function pdfToImage(file, pageNum, format) {
  const buf = await file.arrayBuffer();
  const pdf = pdfDoc || (await pdfjsLib.getDocument({data: buf}).promise);
  const page = await pdf.getPage(pageNum || 1);
  const scale = format === 'ico' ? 2 : 2;
  const viewport = page.getViewport({scale});
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
  return canvas;
}

// ─── Main conversion ─────────────────────────────
btnConvert.addEventListener('click', async () => {
  if (!selectedFile) return;

  btnConvert.disabled = true;
  btnConvert.innerHTML = '<span class="spinner visible"></span>转换中...';
  result.className = 'result';
  result.innerHTML = '';

  try {
    const ext = '.' + selectedFile.name.split('.').pop().toLowerCase();
    const srcFmt = EXT_MAP[ext];
    const dstFmt = selectedFmt;
    const q = parseInt(quality.value);
    let outBlob;
    let outExt = dstFmt === 'jpg' ? '.jpg' : '.' + dstFmt;

    // ── PDF source ────────────────────────────────
    if (srcFmt === 'pdf') {
      const pageNum = parseInt(pageSelect.value) || 1;
      const canvas = await pdfToImage(selectedFile, pageNum, dstFmt);
      outBlob = await canvasToBlob(canvas, dstFmt, q);
      if (dstFmt === 'ico') {
        const img = await loadImageFromBlob(outBlob);
        outBlob = await createICOBlob(img, Math.max(canvas.width, canvas.height));
        outExt = '.ico';
      }
    }
    // ── ICO source ────────────────────────────────
    else if (srcFmt === 'ico') {
      const buf = await selectedFile.arrayBuffer();
      const entry = parseICO(buf);
      const imgBlob = extractICOImage(buf, entry);
      const img = await loadImageFromBlob(imgBlob);
      if (dstFmt === 'ico') {
        outBlob = await createICOBlob(img, Math.max(img.naturalWidth, img.naturalHeight));
        outExt = '.ico';
      } else if (dstFmt === 'pdf') {
        outBlob = await imagesToPDF([img]);
        outExt = '.pdf';
      } else {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        outBlob = await canvasToBlob(canvas, dstFmt, q);
      }
    }
    // ── JPG / PNG source ──────────────────────────
    else {
      const img = await loadImageFromBlob(selectedFile);
      if (dstFmt === 'ico') {
        outBlob = await createICOBlob(img, Math.max(img.naturalWidth, img.naturalHeight));
        outExt = '.ico';
      } else if (dstFmt === 'pdf') {
        outBlob = await imagesToPDF([img]);
        outExt = '.pdf';
      } else if (dstFmt === 'jpg' || dstFmt === 'png') {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        outBlob = await canvasToBlob(canvas, dstFmt, q);
      }
    }

    // Download
    const dlName = selectedFile.name.replace(/\.[^.]+$/, '') + outExt;
    const url = URL.createObjectURL(outBlob);
    result.className = 'result success';
    result.innerHTML = `转换完成 &mdash; <a href="${url}" download="${dlName}">下载 ${dlName}</a> (${formatBytes(outBlob.size)})`;

  } catch (err) {
    result.className = 'result error';
    result.textContent = `转换失败: ${err.message}`;
  } finally {
    btnConvert.disabled = false;
    btnConvert.textContent = '开始转换';
  }
});

// ─── Image → PDF (jsPDF) ─────────────────────────
async function imagesToPDF(images) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'px', hotfixes: ['px_scaling'] });
  let first = true;

  for (const img of images) {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    c.getContext('2d').drawImage(img, 0, 0);
    const dataUrl = c.toDataURL('image/jpeg', 0.92);

    // Fit to page
    const maxW = 420, maxH = 594; // A4 in px at 72dpi
    let w = img.naturalWidth, h = img.naturalHeight;
    if (w > maxW) { h = h * maxW / w; w = maxW; }
    if (h > maxH) { w = w * maxH / h; h = maxH; }

    if (first) { first = false; } else { doc.addPage(); }
    doc.addImage(dataUrl, 'JPEG', (maxW - w) / 2, (maxH - h) / 2, w, h);
  }

  return doc.output('blob');
}
</script>
</body>
</html>
